# Configuração Otimizada do Hyprland para Intel UHD 620
# Performance balanceada sem superaquecimento
# Sintaxe corrigida para Hyprland v0.53.3
# Keybinds corrigidos - conflitos resolvidos
# https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nemo
$browser = firefox
$editor = code
$menu = walker


#############################
# GTK environment
#############################
env = GTK_THEME,Arc-Dark
env = GTK_ICON_THEME,Arc-Dark


#################
### AUTOSTART ###
#################

exec-once = waybar & swaync
exec-once = awww-daemon
exec-once = awww img ~/Imagens/wallpapers/pexels-eberhardgross-4067908.jpg
exec-once = nm-applet
exec-once = blueman-applet
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = kwalletd5
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = swayosd-server
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME
exec-once = hyprpm reload -n
exec-once = systemctl --user start elephant.service
exec-once = walker --gapplication-service 


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland


###################
### PERMISSIONS ###
###################

ecosystem {
    enforce_permissions = 1
}

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 1
    border_size = 3

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false
    layout = master
}

decoration {
    rounding = 16

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 3
        render_power = 2
        color = rgba(1a1a1a99)
        offset = 1 1
    }

    dim_inactive = true
    dim_strength = 0.1
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.0
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows,      1, 3, wind,    slide
    animation = windowsIn,    1, 3, winIn,   slide
    animation = windowsOut,   1, 2, winOut,  slide
    animation = windowsMove,  1, 3, wind,    slide
    animation = border,       1, 5, default
    animation = borderangle,  1, 20, liner,  loop
    animation = fade,         1, 4, default
    animation = workspaces,   1, 3, default
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

window = bordersize 0, onworkspace:w[tv1], floating:0
window = rounding 0,   onworkspace:w[tv1], floating:0
window = bordersize 0, onworkspace:f[1],   floating:0
window = rounding 0,   onworkspace:f[1],   floating:0

#dwindle {
#    pseudotile = true
#    preserve_split = true
#    smart_split = true
#    smart_resizing = true
#}

master {
    new_status = slave
    new_on_top = false
    mfact = 0.5
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    #vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

render {
    direct_scanout = true
}


#############
### INPUT ###
#############

input {
    kb_layout = br
    kb_variant = abnt2
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0.5

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = true
        tap-and-drag = true
    }

    scroll_method = 2fg
    scroll_factor = 3.0
}


###################
### KEYBINDINGS ###
###################

# ══════════════════════════════════════════════════════════════
# MAPA DE ATALHOS (sem conflitos)
#
#  Super + Q             → Terminal (kitty)
#  Super + C             → Fechar janela
#  Super + M             → Sair do Hyprland
#  Super + E             → Gerenciador de arquivos
#  Super + V             → Clipboard (cliphist)
#  Super + Shift + V     → Alternar flutuante
#  Super + R             → Menu (rofi)
#  Super + Shift + R     → Window switcher (rofi)
#  Super + P             → Pseudotile
#  Super + F             → Fullscreen
#  Super + T             → Editor (VSCode)
#  Super + S             → Scratchpad toggle
#  Super + Shift + S     → Mover para scratchpad
#  Super + grave         → Terminal scratchpad
#  Super + Alt + J       → Toggle split layout
#  Super + Setas         → Mover foco
#  Super + H/J/K/L       → Mover foco (vim)
#  Super + Shift + Setas → Mover janela
#  Super + Shift + H/J/K/L → Mover janela (vim)
#  Super + Ctrl + Setas  → Redimensionar janela
#  Super + 1..0          → Ir para workspace
#  Super + Shift + 1..0  → Mover janela para workspace
#  Super + Ctrl + L      → Hyprlock
#  Super + Shift + C     → Editar hyprland.conf
#  Super + Y             → Yazi
#  Super + O             → Obsidian
#  Super + N             → Librewolf
#  Print                 → Screenshot janela
#  Shift + Print         → Screenshot região
# ══════════════════════════════════════════════════════════════

$mainMod = SUPER

# ── Aplicativos ──────────────────────────────────────────────
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, walker --modules clipboard

bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, walker --modules windows

bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, exec, $editor

# ── Terminal scratchpad ───────────────────────────────────────
bind = $mainMod, grave, togglespecialworkspace, terminal
exec-once = kitty --class kitty-scratch
window = workspace special:terminal silent, class:^(kitty-scratch)$

# ── Layout ───────────────────────────────────────────────────
# bind = $mainMod ALT, J, togglesplit,

# ── Navegação de foco — Setas ────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ── Navegação de foco — Vim (hjkl) ───────────────────────────
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# ── Mover janelas — Setas ────────────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ── Mover janelas — Vim (hjkl) ───────────────────────────────
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# ── Redimensionar — Setas ────────────────────────────────────
binde = $mainMod CTRL, left,  resizeactive, -20 0
binde = $mainMod CTRL, right, resizeactive,  20 0
binde = $mainMod CTRL, up,    resizeactive,  0 -20
binde = $mainMod CTRL, down,  resizeactive,  0  20

# ── Screenshots ──────────────────────────────────────────────
bind = ,      PRINT, exec, hyprshot -m window
bind = SHIFT, PRINT, exec, hyprshot -m region

# ── Workspaces ───────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Mover janela para workspace ──────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Scratchpad ───────────────────────────────────────────────
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── Mouse ────────────────────────────────────────────────────
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ── Multimídia — SwayOSD ─────────────────────────────────────
bind = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bind = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# ── Atalhos customizados ─────────────────────────────────────
bind = $mainMod CTRL,  L, exec, hyprlock
bind = $mainMod SHIFT, C, exec, $editor ~/.config/hypr/hyprland.conf
bind = $mainMod,       Y, exec, kitty yazi
bind = $mainMod,       O, exec, obsidian > /dev/null 2>&1 &
bind = $mainMod,       N, exec, librewolf > /dev/null 2>&1 &


##############################
### WINDOWS AND WORKSPACES ###
##############################

window = suppressevent maximize, class:.*
window = nofocus, xwayland:1, floating:1, fullscreen:0, pinned:0, class:^$, title:^$

# Janelas flutuantes
window = float, class:^(chromium)$, title:^(Save File)$
window = float, class:^(firefox)$,  title:^(Save As)$
window = float, class:^(firefox)$,  title:^(Library)$

# Workspace rules
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1

# Opacidade para VSCode
window = opacity 1.0 1.0, class:^(Code)$

# Jogos/3D em performance máxima
window = immediate, class:^(blender)$
window = immediate, class:^(steam_app_).*
window = immediate, title:^(.*Minecraft.*)$

# Navegadores: desabilitar blur
window = noblur, class:^(firefox)$
window = noblur, class:^(chromium)$
window = noblur, class:^(librewolf)$


exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"

#######################################
plugin {
    hyprexpo {
        columns = 2
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current
    }
}

# bind = $mainMod, tab, hyprexpo:expo, toggle
hyprexpo-gesture = 3, up, expo

