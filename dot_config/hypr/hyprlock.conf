general {
    no_fade_in = false
    grace = 2
}

background {
    monitor = eDP-1  # ou HDMI-A-1, conforme seu monitor
    path = /usr/share/backgrounds/your_wallpaper.png
    blur_size = 5
    blur_passes = 3
    noise = 0.011
    contrast = 1.2
    brightness = 0.8
}

input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 2
    outline_color = rgba(0,0,0,0.5)
    inner_color = rgba(20,20,20,0.7)
    font_color = rgba(255,255,255,1.0)
    fade_on_empty = false
    placeholder_text = Password...
    shadow_passes = 2
    dots_size = 0.2
    dots_spacing = 0.4
}
