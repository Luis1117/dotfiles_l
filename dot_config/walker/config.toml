theme = "default"

[providers]
default = [
  "desktopapplications",
  "calc",
  "runner",
  "websearch",
]
empty = ["desktopapplications"]
max_results = 50

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "b "
provider = "bookmarks"

[[providers.prefixes]]
prefix = "t "
provider = "todo"

[[providers.prefixes]]
prefix = "w "
provider = "windows"

[[providers.prefixes]]
prefix = "bt "
provider = "bluetooth"

[[providers.prefixes]]
prefix = "pk "
provider = "archlinuxpkgs"

[[providers.files]]
enabled = true
recents = true

[customcommands]
"reload waybar" = "pkill waybar && waybar &"
"reload hyprland" = "hyprctl reload"
"suspender" = "systemctl suspend"
