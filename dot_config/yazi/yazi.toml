[opener]
edit = [
    { run = '/sbin/nvim "$@"', block = true, desc = "Edit with Neovim" }
]
# pdf = [
#     { run = 'tdf "$@"', desc = "Abrir PDF com tdf", block=true },
#     { run = 'xdg-open "$@"', desc = "Open with default app" }
# ]
pdf = [
    { run = 'tdf "$@"', desc = "Abrir PDF com tdf", block = true },
    { run = 'gtk-launch org.gnome.Papers "$@"', desc = "Abrir com Papers", orphan = true },
    { run = 'xdg-open "$@"', desc = "Open with default app" }
]

image = [
    { run = 'nomacs "$@"', desc = "View with nomacs" },
    { run = 'xdg-open "$@"', desc = "Open with default app" }
]
text = [
    { run = '/sbin/nvim "$@"', block = true, desc = "Edit with Neovim" }
]
gnuplot = [
    { run = '/sbin/nvim "$@"', block = true, desc = "Edit with Neovim" }
]

# djvu = [
#     { run = 'atril "$@"', desc = "Abrir DJVU com Atril", block = false }
# ]

djvu = [
    { run = 'gtk-launch org.gnome.Papers "$@"', desc = "Abrir com Papers", orphan = true },
    { run = 'atril "$@"', desc = "Abrir com Atril", orphan = true }
]

[open]
rules = [
    { name = "*/", use = "folder" },
    # PDFs
    { mime = "application/pdf", use = "pdf" },
    # Imagens
    { mime = "image/*", use = "image" },
    # Textos para editar
    { mime = "text/*", use = "edit" },
    { name = "*.txt", use = "edit" },
    { name = "*.md", use = "edit" },
    { name = "*.py", use = "edit" },
    { name = "*.sh", use = "edit" },
    { name = "*.toml", use = "edit" },
    { name = "*.yaml", use = "edit" },
    { name = "*.yml", use = "edit" },
    { name = "*.ipynb", use = "edit" },
    { name = "*.json", use = "edit" },
    { name = "*.js", use = "edit" },
    { name = "*.css", use = "edit" },
    { name = "*.html", use = "edit" },
    # Gnuplot
    { name = "*.gp", use = "gnuplot" },
    { name = "*.plt", use = "gnuplot" },
    { name = "*.gnuplot", use = "gnuplot" },
]

[plugin]
prepend_fetchers = [
  { id = "git", name = "*", run = "git" },
  { id = "git", name = "*/", run = "git" },
]
